; ============================================================================
; PlatformIO project configuration
; ============================================================================
; This is the file that makes the "clean swap" from Stage A to Stage B
; possible. Right now only [env:native] is active -- it compiles this
; project's C++ using your Mac's own compiler (clang/gcc) and produces a
; normal executable you run directly in the terminal. No hardware, no
; emulator involved.
;
; When your ESP32 arrives (Stage B), you'll uncomment the [env:esp32dev]
; block below, add main_esp32.cpp + SCT013CurrentSensor, and run
; `pio run -e esp32dev -t upload`. The core/ and sensors/ interface code
; doesn't change -- only which files get pulled into the build changes,
; controlled by build_src_filter below.

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
; build_src_filter controls exactly which .cpp files this environment
; compiles. We explicitly include main_native.cpp (this env's entry point)
; and exclude nothing else yet since there's no esp32-only code present.
build_src_filter = +<*> -<main_esp32.cpp>

; --- Stage B (uncomment once ESP32 + PlatformIO's espressif32 platform ---
; --- are set up; requires `pio pkg install` for platform + libraries)   ---
; [env:esp32dev]
; platform = espressif32
; board = esp32dev
; framework = arduino
; build_src_filter = +<*> -<main_native.cpp>
; lib_deps =
;     knolleary/PubSubClient @ ^2.8
